
<!-- Page 1: Forgot Password -->
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forgot Password</title>
   <style>
       body {
           background-color: wheat;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           font-family: sans-serif;
       }

       .container {
           display: flex;
           flex-direction: column;
           gap: 20px;
           background-color: #fff;
           padding: 30px;
           border-radius: 10px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
       }

       .form-box {
           padding: 20px;
           width: 300px;
           border-radius: 10px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
       }

       h2 {
           text-align: center;
           margin-bottom: 20px;
           
       }
       p{
        text-align: center;
       }
       .form-box label {
           display: block;
           margin-bottom: 5px;
       }

       .form-box input {
           width: 92%;
           padding: 10px;
           margin-bottom: 15px;
           border: 1px solid #ccc;
           border-radius: 5px;
       }

       .form-box button {
           background-color: #f2c260;
           color: white;
           padding: 10px 20px;
           border: none;
           border-radius: 5px;
           cursor: pointer;
           width: 100%;
       }
       /* Example CSS for messages */
.message-container {
    margin-bottom: 20px;
}

.message {
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
}

.message.success {
    background-color: #d4edda;
    color: #155724;
}

.message.error {
    background-color: #f8d7da;
    color: #721c24;
}

.message.warning {
    background-color: #fff3cd;
    color: #856404;
}

   </style>
</head>
<body>
   <div class="container">
     
    {% if messages %}
           <div class="message-container">
               {% for message in messages %}
                   <div class="message {{ message.tags }}">
                       {{ message }}
                   </div>
               {% endfor %}
           </div>
       {% endif %}
       <div class="form-box">
           <h2>Forgot Password</h2>
           <p>Enter your email address</p>
           <form method="POST" >
               {% csrf_token %}
               <label for="email">Email:</label>
               <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
               <button type="submit">Continue</button>
           </form>
       </div>
   </div>
</body>
</html>
